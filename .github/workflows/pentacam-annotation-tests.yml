name: Pentacam annotation tests

on:
  push:
    branches: [main]
    paths:
      - "launch_gui.py"
      - "pupil_tracking/tests/test_pentacam_workspace_core.py"
      - ".github/workflows/pentacam-annotation-tests.yml"
  pull_request:
    paths:
      - "launch_gui.py"
      - "pupil_tracking/tests/test_pentacam_workspace_core.py"
      - ".github/workflows/pentacam-annotation-tests.yml"

permissions:
  contents: read

jobs:
  annotation-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest numpy opencv-python-headless pillow
      - name: Compile main launcher and embedded annotation workspace
        run: python -m py_compile launch_gui.py
      - name: Run annotation core tests
        run: python -m pytest pupil_tracking/tests/test_pentacam_workspace_core.py -q
